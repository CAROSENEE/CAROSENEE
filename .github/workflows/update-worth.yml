name: Update GitHub Worth

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:         # manual run button
  push:
    paths:
      - ".github/scripts/update_worth.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute worth and update README
        env:
          GH_USER: CAROSENEE
          # Default token is enough for public data. If the GraphQL step fails,
          # add a repo secret named GH_STATS_TOKEN and use it instead:
          # GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_worth.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update GitHub worth estimate"
            git push
          fi
